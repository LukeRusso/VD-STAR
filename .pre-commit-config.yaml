---
# Auto-format C++ on commit.
repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        description: Format C++ sources with the repo's .clang-format.
        entry: clang-format -i
        language: system
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
        exclude: ^(boost_1_92_0|Tessil_robin_map|catch2)/
      - id: ctest
        name: ctest
        description: Build and run the test suite.
        entry: bash -c 'cmake -B build -G Ninja >/dev/null && cmake --build build --parallel >/dev/null && ctest --test-dir build --output-on-failure'
        language: system
        pass_filenames: false
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
        exclude: ^(boost_1_92_0|Tessil_robin_map|catch2)/
